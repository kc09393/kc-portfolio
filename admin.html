<div id="adm" style="background:#111;border:1px solid rgba(255,255,255,.07);border-radius:12px;width:440px;max-height:90vh;overflow-y:auto;box-shadow:0 40px 100px rgba(0,0,0,.8)"></div>
<script id="admin-js">
(function(){
'use strict';

var SAVE_KEY='kc_pf_admin_cache';
var GH_IMGS_BASE='https://kc09393.github.io/portfolio/imgs/',GH_STATE_PATH='imgs/state.json',_ghSyncTm=null;
function escH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var IDB_NAME='kc_pf_imgs',IDB_STORE='imgs',_idb=null;

function openIDB(){if(_idb)return Promise.resolve(_idb);return new Promise(function(res,rej){var r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=function(e){e.target.result.createObjectStore(IDB_STORE);};r.onsuccess=function(e){_idb=e.target.result;res(_idb);};r.onerror=function(){rej(r.error);};});}

function idbPut(k,v){if(_idb){try{var tx=_idb.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put({img:v,ts:Date.now()},k);}catch(e){}return;}openIDB().then(function(db){try{var tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put({img:v,ts:Date.now()},k);}catch(e){}}).catch(function(){});}

function idbGetAll(){return openIDB().then(function(db){return new Promise(function(res){var tx=db.transaction(IDB_STORE,'readonly'),s=tx.objectStore(IDB_STORE),out={};var cr=s.openCursor();cr.onsuccess=function(e){var c=e.target.result;if(c){out[c.key]=c.value;c.continue();}else res(out);};cr.onerror=function(){res({});};});}).catch(function(){return{};});}


function save(){
  try{
    var slim={_v:state._v,bio:state.bio||'',artworks:state.artworks.map(function(a){return{key:a.key,title:a.title,lbl:a.lbl,sub:a.sub,desc:a.desc,img:(a.img&&!a.img.startsWith('data:'))?a.img:''};}),photos:state.photos.map(function(p){return{key:p.key,title:p.title,sub:p.sub,desc:p.desc,img:(p.img&&!p.img.startsWith('data:'))?p.img:''};}),certs:state.certs.map(function(c){return{key:c.key,title:c.title,sub:c.sub,cat:c.cat,desc:c.desc,main:(c.main&&!c.main.startsWith('data:'))?c.main:'',thumb:(c.thumb&&!c.thumb.startsWith('data:'))?c.thumb:''};})};
    localStorage.setItem(SAVE_KEY,JSON.stringify(slim));
  }catch(e){}
  state.artworks.forEach(function(a){if(a.img)idbPut('art|'+a.key,a.img);});
  state.photos.forEach(function(p){if(p.img)idbPut('ph|'+p.key,p.img);});
  state.certs.forEach(function(c){if(c.main)idbPut('cert|'+c.key,c.main);});
  scheduleGhSync();
}
var st2; 
function scheduleSave(){clearTimeout(st2);st2=setTimeout(save,800);}

function _ghReq(p,m,path,body){var o={method:m,cache:'no-store',headers:{'Authorization':'token '+p,'Accept':'application/vnd.github.v3+json'}};if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}return fetch('https://api.github.com'+path,o).then(function(r){return r.json();}).catch(function(){return null;});}
function ghUploadImg(p,key,dataUrl){
  var ext=dataUrl.indexOf('image/png')>-1?'png':'jpg';
  var path='/repos/kc09393/portfolio/contents/imgs/'+key+'.'+ext;
  var b64=dataUrl.split(',')[1];
  return _ghReq(p,'GET',path,null).then(function(ex){
    var body={message:'upload '+key,content:b64,branch:'main'};
    if(ex&&ex.sha)body.sha=ex.sha;
    return _ghReq(p,'PUT',path,body);
  }).then(function(res){
    if(res&&res.content){
      return 'https://kc09393.github.io/portfolio/imgs/'+key+'.'+ext;
    }
    return null;
  });
}

function scheduleGhSync(){clearTimeout(_ghSyncTm);_ghSyncTm=setTimeout(ghSyncState,3000);}

async function ghSyncState(){
  var p=localStorage.getItem('kc_pf_pat');
  if(!p)return;
  var uploads=[];
  state.artworks.forEach(function(a){
    if(a.img&&a.img.startsWith('data:')){
      uploads.push(ghUploadImg(p,'art-'+a.key,a.img).then(function(url){
        if(url){a.img=url;idbPut('art|'+a.key,{img:url});}
      }));
    }
  });
  state.photos.forEach(function(ph){
    if(ph.img&&ph.img.startsWith('data:')){
      uploads.push(ghUploadImg(p,'ph-'+ph.key,ph.img).then(function(url){
        if(url){ph.img=url;idbPut('ph|'+ph.key,{img:url});}
      }));
    }
  });
  state.certs.forEach(function(c){
    if(c.main&&c.main.startsWith('data:')){
      uploads.push(ghUploadImg(p,'cert-'+c.key,c.main).then(function(url){
        if(url){c.main=url;idbPut('cert|'+c.key,{img:url});}
      }));
    }
  });
  if(uploads.length>0)await Promise.all(uploads);
  var clean={
    _v:Date.now(),
    bio:state.bio||'',
    artworks:state.artworks.map(function(a){return{key:a.key,title:a.title||'',lbl:a.lbl||'',sub:a.sub||'',desc:a.desc||'',img:(a.img&&!a.img.startsWith('data:'))?a.img:''};}).filter(Boolean),
    photos:state.photos.map(function(ph){return{key:ph.key,title:ph.title||'',sub:ph.sub||'',desc:ph.desc||'',img:(ph.img&&!ph.img.startsWith('data:'))?ph.img:''};}).filter(Boolean),
    certs:state.certs.map(function(c){return{key:c.key,title:c.title||'',sub:c.sub||'',cat:c.cat||'professional',desc:c.desc||'',main:(c.main&&!c.main.startsWith('data:'))?c.main:'',thumb:(c.thumb&&!c.thumb.startsWith('data:'))?c.thumb:''};}).filter(Boolean)
  };
  var __cleanSig=JSON.stringify({bio:clean.bio,artworks:clean.artworks,photos:clean.photos,certs:clean.certs});
  if(__cleanSig===localStorage.getItem('kc_pf_last_sig'))return;
  var b64=btoa(unescape(encodeURIComponent(JSON.stringify(clean,null,2))));
  var ex=await _ghReq(p,'GET','/repos/kc09393/portfolio/contents/imgs/state.json',null);
  var body={message:'sync state '+clean._v,content:b64,branch:'main'};
  if(ex&&ex.sha)body.sha=ex.sha;
  await _ghReq(p,'PUT','/repos/kc09393/portfolio/contents/imgs/state.json',body);
  localStorage.setItem('kc_pf_last_sig',__cleanSig);
}

async function ghLoadStateJson(){
  var p=localStorage.getItem('kc_pf_pat');
  if(!p)return;
  var d=await _ghReq(p,'GET','/repos/kc09393/portfolio/contents/imgs/state.json',null);
  if(!d||!d.content)return;
  var remote;
  try{var _bin=atob(d.content.replace(/\n/g,''));var _bytes=new Uint8Array(_bin.length);for(var _bi=0;_bi<_bin.length;_bi++)_bytes[_bi]=_bin.charCodeAt(_bi);remote=JSON.parse(new TextDecoder('utf-8').decode(_bytes));}catch(e){return;}
  if(!remote||!remote._v)return;
  var localV=state._v||0;
  if(remote._v<=localV)return;
  var changed=false;
  if(remote.artworks){remote.artworks.forEach(function(ra){var la=state.artworks.find(function(a){return a.key===ra.key;});if(la){if(ra.img&&ra.img!==la.img){la.img=ra.img;changed=true;}if(ra.title!==undefined&&ra.title!==la.title){la.title=ra.title;changed=true;}if(ra.sub!==undefined&&ra.sub!==la.sub){la.sub=ra.sub;changed=true;}if(ra.desc!==undefined&&ra.desc!==la.desc){la.desc=ra.desc;changed=true;}if(ra.lbl!==undefined&&ra.lbl!==la.lbl){la.lbl=ra.lbl;changed=true;}}else{state.artworks.push(ra);changed=true;}});}
  if(remote.photos){remote.photos.forEach(function(rp){var lp=state.photos.find(function(p2){return p2.key===rp.key;});if(lp){if(rp.img&&rp.img!==lp.img){lp.img=rp.img;changed=true;}if(rp.title!==undefined&&rp.title!==lp.title){lp.title=rp.title;changed=true;}if(rp.sub!==undefined&&rp.sub!==lp.sub){lp.sub=rp.sub;changed=true;}if(rp.desc!==undefined&&rp.desc!==lp.desc){lp.desc=rp.desc;changed=true;}}else{state.photos.push(rp);changed=true;}});}
  if(remote.certs){remote.certs.forEach(function(rc,ri){var lc=state.certs[ri]||state.certs.find(function(c){return c.key&&c.key===rc.key;});if(lc){if(rc.main&&rc.main!==lc.main&&rc.main.indexOf('undefined')<0){lc.main=rc.main;changed=true;}if(rc.thumb&&rc.thumb!==lc.thumb){lc.thumb=rc.thumb;changed=true;}if(rc.title&&rc.title!==lc.title){lc.title=rc.title;changed=true;}if(rc.sub!==undefined&&rc.sub!==lc.sub){lc.sub=rc.sub;changed=true;}if(rc.cat&&rc.cat!==lc.cat){lc.cat=rc.cat;changed=true;}if(rc.desc!==undefined&&rc.desc!==lc.desc){lc.desc=rc.desc;changed=true;}if(rc.key&&rc.key!==lc.key){lc.key=rc.key;changed=true;}}else{state.certs.push(rc);changed=true;}});}
  if(remote.bio&&remote.bio!==state.bio){state.bio=remote.bio;changed=true;}
  if(changed){state._v=remote._v;save();renderArtGrid();renderPhotoGrid();renderCertGrid();}
}



function flashSaved(m,el){
  var t=el||document.querySelector('#ap-b .saved-msg');
  if(!t)return;
  t.textContent=m||'✓ 已儲存';t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2200);
}

function buildAdminHTML(){
  var COPTS=['international','government','professional','fashion','tech','award'];
  var coptHtml=COPTS.map(function(v){return'<option value="'+v+'">'+certLabel(v)+'</option>';}).join('');
  return(

    '<div class="ap-h"><span class="ap-logo">◈ Portfolio Admin</span><div style="display:flex;gap:8px;align-items:center"><button class="ap-export-btn" id="adm-export-btn">⬇ 匯出 HTML</button><button class="ap-export-btn ap-deploy-btn" id="adm-deploy-btn">🚀 部署</button><button class="ap-hx" id="adm-close">✕</button></div></div>'
    +'<div class="ap-pat-bar" id="adm-pat-bar"><span class="ap-pat-label">GitHub PAT</span><input class="ap-pat-input" id="adm-pat-input" type="password" placeholder="github_pat_…" autocomplete="off"><button class="ap-pat-save" id="adm-pat-save">儲存</button><span class="ap-pat-ok" id="adm-pat-ok"></span></div>'
    // Tabs
    +'<div class="ap-tabs">'
    +'<button class="ap-tab on" data-sec="sec-art">◈ Studio</button>'

    +'<div class="ap-b" id="ap-b">'

function makeThumbSlotBind(slotEl,inputEl,onLoad){
  slotEl.addEventListener('click',function(e){if(e.target!==inputEl)inputEl.click();});
  inputEl.addEventListener('change',function(e){
    var file=e.target.files[0];if(!file)return;
    var r=new FileReader();
    r.onload=function(ev){
      var old=slotEl.querySelector('img');if(old)old.remove();
      var img=document.createElement('img');img.src=ev.target.result;
      img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;border-radius:0';
      slotEl.insertBefore(img,slotEl.firstChild);
      slotEl.classList.add('has');
      var ph=slotEl.querySelector('.slot-ph'),lb2=slotEl.querySelector('.slot-lbl');
      if(ph)ph.style.display='none';if(lb2)lb2.style.display='none';
      onLoad(ev.target.result);
    };
    r.readAsDataURL(file);inputEl.value='';
  });
}

function bindAdminItemList(type,arr,renderList,renderGrid,fiPrefix,thPrefix){
  var list=document.getElementById('adm-'+(type==='art'?'art':'ph')+'-list');
  if(!list)return;
  // Toggle edit panels
  list.querySelectorAll('.adm-edit-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      var i=parseInt(btn.dataset.i);
      var panel=document.getElementById('aep-'+type+'-'+i);
      list.querySelectorAll('.adm-edit-panel').forEach(function(p){if(p.id!=='aep-'+type+'-'+i)p.classList.remove('open');});
      if(panel)panel.classList.toggle('open');
    });
  });
  // Delete
  list.querySelectorAll('.adm-rm-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(!confirm('確定刪除？'))return;
      arr.splice(parseInt(btn.dataset.i),1);
      renderGrid();renderList();scheduleSave();
      flashSaved('✓ 已刪除',document.getElementById('global-saved'));
    });
  });
  // Save edits
  list.querySelectorAll('.aep-save').forEach(function(btn){
    btn.addEventListener('click',function(){
      var i=parseInt(btn.dataset.i),panel=document.getElementById('aep-'+type+'-'+i);if(!panel)return;
      if(type==='art'){
        state.artworks[i].title=panel.querySelector('.aep-title').value;
        state.artworks[i].lbl=panel.querySelector('.aep-lbl').value;
        state.artworks[i].sub=panel.querySelector('.aep-sub').value;
        state.artworks[i].desc=panel.querySelector('.aep-desc').value;
      } else {
        state.photos[i].title=panel.querySelector('.aep-title').value;
        state.photos[i].sub=panel.querySelector('.aep-sub').value;
        state.photos[i].desc=panel.querySelector('.aep-desc').value;
      }
      renderGrid();renderList();scheduleSave();
      flashSaved('✓ 已儲存',document.getElementById('global-saved'));
    });
  });
  // Move up/down
  list.querySelectorAll('.aep-up').forEach(function(btn){
    btn.addEventListener('click',function(){
      var i=parseInt(btn.dataset.i);if(i===0)return;
      var tmp=arr[i];arr[i]=arr[i-1];arr[i-1]=tmp;
      renderGrid();renderList();scheduleSave();
    });
  });
  list.querySelectorAll('.aep-dn').forEach(function(btn){
    btn.addEventListener('click',function(){
      var i=parseInt(btn.dataset.i);if(i>=arr.length-1)return;
      var tmp=arr[i];arr[i]=arr[i+1];arr[i+1]=tmp;
      renderGrid();renderList();scheduleSave();
    });
  });
  // Image upload in edit panel
  list.querySelectorAll('[id^="'+fiPrefix+'"]').forEach(function(fi){
    var i=parseInt(fi.id.replace(fiPrefix,''));
    var th=document.getElementById(thPrefix+i);
    if(!th)return;
    th.addEventListener('click',function(e){if(e.target!==fi)fi.click();});
    fi.addEventListener('change',function(e){
      var file=e.target.files[0];if(!file)return;
      var r=new FileReader();
      r.onload=function(ev){
        if(type==='art')state.artworks[i].img=ev.target.result;
        else state.photos[i].img=ev.target.result;
        var oldImg=th.querySelector('img');if(oldImg)oldImg.src=ev.target.result;
        else{var ni=document.createElement('img');ni.style.cssText='width:100%;height:100%;object-fit:contain;position:absolute;inset:0';th.insertBefore(ni,th.firstChild);ni.src=ev.target.result;}
        renderGrid();scheduleSave();
      };
      r.readAsDataURL(file);fi.value='';
    });
  });
}

function bindDragSort(listId,arr,renderListFn,renderGridFn){
  var list=document.getElementById(listId);if(!list)return;
  var dragSrc=null,fromHandle=false;
  // Track whether mousedown originated from a drag handle
  list.addEventListener('mousedown',function(e){
    fromHandle=!!e.target.closest('.drag-handle');
  });
  list.querySelectorAll('.adm-item').forEach(function(item){
    item.addEventListener('dragstart',function(e){
      if(!fromHandle){e.preventDefault();return;}
      dragSrc=item;
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain','');
      setTimeout(function(){item.classList.add('drag-active');},0);
    });
    item.addEventListener('dragend',function(){
      item.classList.remove('drag-active');
      list.querySelectorAll('.adm-item').forEach(function(x){x.classList.remove('drag-over');});
      dragSrc=null;fromHandle=false;
    });
    item.addEventListener('dragover',function(e){
      e.preventDefault();e.dataTransfer.dropEffect='move';
      if(dragSrc&&item!==dragSrc){
        list.querySelectorAll('.adm-item').forEach(function(x){x.classList.remove('drag-over');});
        item.classList.add('drag-over');
      }
    });
    item.addEventListener('dragleave',function(){item.classList.remove('drag-over');});
    item.addEventListener('drop',function(e){
      e.preventDefault();
      if(!dragSrc||dragSrc===item)return;
      var items=Array.from(list.querySelectorAll('.adm-item'));
      var fi=items.indexOf(dragSrc),ti=items.indexOf(item);
      if(fi<0||ti<0)return;
      var moved=arr.splice(fi,1)[0];arr.splice(ti,0,moved);
      renderListFn();renderGridFn();scheduleSave();
    });
  });
}

function bindAdmin(){

  var admOv=document.getElementById('adm-ov');
  if(admOv)admOv.addEventListener('click',function(e){if(e.target===admOv)admOv.style.display='none';});

  // Tabs
  document.querySelectorAll('.ap-tab').forEach(function(tab){
    tab.addEventListener('click',function(){
      document.querySelectorAll('.ap-tab').forEach(function(t){t.classList.remove('on');});
      document.querySelectorAll('.ap-sec').forEach(function(s){s.classList.remove('on');});
      tab.classList.add('on');

  if(btnAddArt)btnAddArt.addEventListener('click',function(){

    var lbl=(document.getElementById('art-new-lbl')||{}).value||'Mixed Media';

    artNewImg=null;
    // Reset form
    if(artSlot){var oldI=artSlot.querySelector('img');if(oldI)oldI.remove();artSlot.classList.remove('has');var ph=artSlot.querySelector('.slot-ph'),lb2=artSlot.querySelector('.slot-lbl');if(ph)ph.style.display='';if(lb2)lb2.style.display='';}
    ['art-new-title','art-new-lbl','art-new-sub','art-new-desc'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
    flashSaved('✓ 畫作已新增',document.getElementById('global-saved'));
    document.querySelector('#adm-art-list')?.scrollIntoView({behavior:'smooth',block:'nearest'});
  });

  // ── New Photo ──────────────────────────────────────
  var phNewImg=null;
  var phSlot=document.getElementById('ph-new-slot'),phFi=document.getElementById('ph-new-img');
  if(phSlot&&phFi)makeThumbSlotBind(phSlot,phFi,function(b64){phNewImg=b64;});
  var btnAddPh=document.getElementById('btn-add-ph');
  if(btnAddPh)btnAddPh.addEventListener('click',function(){
    if(!phNewImg){flashSaved('⚠ 請先上傳圖片',document.getElementById('global-saved'));return;}
    var title=(document.getElementById('ph-new-title')||{}).value||'Untitled';
    var sub=(document.getElementById('ph-new-sub')||{}).value||'';
    var desc=(document.getElementById('ph-new-desc')||{}).value||'';
    state.photos.push({key:'p'+Date.now(),img:phNewImg,title:title,sub:sub,desc:desc});
    renderPhotoGrid();renderAdminPhList();save();
    phNewImg=null;
    if(phSlot){var oldI=phSlot.querySelector('img');if(oldI)oldI.remove();phSlot.classList.remove('has');var ph2=phSlot.querySelector('.slot-ph'),lb3=phSlot.querySelector('.slot-lbl');if(ph2)ph2.style.display='';if(lb3)lb3.style.display='';}
    ['ph-new-title','ph-new-sub','ph-new-desc'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
    flashSaved('✓ 攝影已新增',document.getElementById('global-saved'));
    document.querySelector('#adm-ph-list')?.scrollIntoView({behavior:'smooth',block:'nearest'});
  });

  // ── New Cert ───────────────────────────────────────
  var newCertMain=null;
  var ncSlot=document.getElementById('new-cert-slot'),ncFi=document.getElementById('nc-main-input');
  if(ncSlot&&ncFi)makeThumbSlotBind(ncSlot,ncFi,function(b64){newCertMain=b64;});
  var btnAddCert=document.getElementById('btn-add-cert');
  if(btnAddCert)btnAddCert.addEventListener('click',function(){
    if(!newCertMain){flashSaved('⚠ 請先上傳圖片',document.getElementById('global-saved'));return;}
    state.certs.push({
      key:'c'+Date.now(),main:newCertMain,
      title:(document.getElementById('nc-title')||{}).value||'',
      sub:(document.getElementById('nc-sub')||{}).value||'',
      cat:(document.getElementById('nc-cat')||{}).value||'professional',
      desc:(document.getElementById('nc-desc')||{}).value||''
    });
    renderCertGrid();renderAdminCertList();save();newCertMain=null;
    if(ncSlot){var oldI=ncSlot.querySelector('img');if(oldI)oldI.remove();ncSlot.classList.remove('has');var ph3=ncSlot.querySelector('.slot-ph'),lb4=ncSlot.querySelector('.slot-lbl');if(ph3)ph3.style.display='';if(lb4)lb4.style.display='';}
    ['nc-title','nc-sub','nc-desc'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
    flashSaved('✓ 證照已新增',document.getElementById('global-saved'));
  });

  // ── About Bio ──────────────────────────────────────
  var bioEdit=document.getElementById('about-bio-edit');
  if(bioEdit){
    bioEdit.value=state.bio||(document.getElementById('about-bio')?document.getElementById('about-bio').textContent:'')||'';
    var btnBio=document.getElementById('btn-save-about');
    if(btnBio)btnBio.addEventListener('click',function(){
      state.bio=bioEdit.value;
      var el=document.getElementById('about-bio');if(el)el.textContent=state.bio;
      scheduleSave();flashSaved('✓ Bio 已儲存',document.getElementById('global-saved'));
    });
  }


  // ── Export & Deploy ──────────────────────────────────
  var PAT_KEY='kc_pf_pat';
  var REPO='kc09393/portfolio',FILE='index.html',BRANCH='main';

  function toB64uAsync(str){
    return new Promise(function(resolve,reject){
      try{
        var blob=new Blob([str],{type:'text/plain'});
        var reader=new FileReader();
        reader.onload=function(e){resolve(e.target.result.split(',')[1]);};
        reader.onerror=function(){reject(new Error('base64 轉換失敗'));};
        reader.readAsDataURL(blob);
      }catch(e){reject(e);}
    });
  }
  function ghReq(pat,method,path,body){
    var opts={method:method,headers:{'Authorization':'token '+pat,'Accept':'application/vnd.github.v3+json'}};
    if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
    return fetch('https://api.github.com'+path,opts).then(function(r){return r.json();});
  }
  function buildDeployHtml(html){
    var sm='var state={',pm='// ── Persistence';
    var si=html.indexOf(sm),pi=html.indexOf(pm,si),ei=html.lastIndexOf('};',pi)+2;
    if(si<0||pi<0||ei<2)return null;
    return html.slice(0,si)+'var state='+JSON.stringify(state)+';'+html.slice(ei);
  }

  // PAT init
  var patInput=document.getElementById('adm-pat-input');
  var patOk=document.getElementById('adm-pat-ok');
  var savedPat=localStorage.getItem(PAT_KEY);
  if(savedPat&&patInput)patInput.value=savedPat;
  if(savedPat&&patOk){patOk.textContent='✓ 已設定';patOk.style.color='#7dd5a0';}

  var patSaveBtn=document.getElementById('adm-pat-save');
  if(patSaveBtn)patSaveBtn.addEventListener('click',function(){
    var val=patInput?patInput.value.trim():'';
    if(!val){if(patOk){patOk.textContent='請輸入 PAT';patOk.style.color='#e88';}return;}
    localStorage.setItem(PAT_KEY,val);
    if(patOk){patOk.textContent='✓ 已儲存';patOk.style.color='#7dd5a0';}
  });

  var exportBtn=document.getElementById('adm-export-btn');
  if(exportBtn)exportBtn.addEventListener('click',function(){
    var btn=this;btn.textContent='⏳ 匯出中...';btn.disabled=true;
    var pat=localStorage.getItem(PAT_KEY);
    ghReq(pat,'GET','/repos/'+REPO+'/git/ref/heads/'+BRANCH,null).then(function(_r0){
      return ghReq(pat,'GET','/repos/'+REPO+'/git/commits/'+_r0.object.sha,null);
    }).then(function(_c0){
      return ghReq(pat,'GET','/repos/'+REPO+'/git/trees/'+_c0.tree.sha+'?recursive=1',null);
    }).then(function(_tr0){
      var _e=_tr0.tree.find(function(x){return x.path===FILE;});
      if(!_e)throw new Error('找不到 '+FILE);
      return ghReq(pat,'GET','/repos/'+REPO+'/git/blobs/'+_e.sha,null);
    }).then(function(_blobData){
      var _bin=atob(_blobData.content.replace(/\n/g,''));
      var _bytes=new Uint8Array(_bin.length);
      for(var _bi=0;_bi<_bin.length;_bi++)_bytes[_bi]=_bin.charCodeAt(_bi);
      return new TextDecoder('utf-8').decode(_bytes);
    }).then(function(html){
      var newHtml=buildDeployHtml(html);
      if(!newHtml){alert('無法定位 state 區塊');btn.textContent='✗ 錯誤';btn.disabled=false;return;}
      var blob=new Blob([newHtml],{type:'text/html'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';
      document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
      btn.textContent='✓ 已下載！';
      setTimeout(function(){btn.textContent='⬇ 匯出 HTML';btn.disabled=false;},2500);
    }).catch(function(){btn.textContent='✗ 錯誤';btn.disabled=false;});
  });

  var deployBtn=document.getElementById('adm-deploy-btn');
  if(deployBtn)deployBtn.addEventListener('click',function(){
    var btn=this;
    var pat=localStorage.getItem(PAT_KEY);
    if(!pat){
      if(patInput){patInput.focus();patInput.style.borderColor='rgba(232,136,136,.8)';}
      if(patOk){patOk.textContent='← 請先儲存 PAT';patOk.style.color='#e88';}
      return;
    }
    btn.textContent='⏳ 讀取…';btn.disabled=true;
    var ctx={};
    function commitWithRetry(attemptsLeft){
      btn.textContent=attemptsLeft<4?('⏳ 重試中…('+(4-attemptsLeft)+'/3)'):'⏳ 取得 ref…';
      return ghReq(pat,'GET','/repos/'+REPO+'/git/ref/heads/'+BRANCH)
      .then(function(ref){
        if(!ref.object)throw new Error(ref.message||'ref 失敗');
        ctx.commitSha=ref.object.sha;
        return ghReq(pat,'GET','/repos/'+REPO+'/git/commits/'+ctx.commitSha);
      })
      .then(function(commit){
        if(!commit.tree)throw new Error(commit.message||'commit 失敗');
        btn.textContent='⏳ 建立 tree…';
        return ghReq(pat,'POST','/repos/'+REPO+'/git/trees',{
          base_tree:commit.tree.sha,
          tree:[{path:FILE,mode:'100644',type:'blob',sha:ctx.blobSha}]
        });
      })
      .then(function(tree){
        if(!tree.sha)throw new Error(tree.message||'tree 失敗');
        btn.textContent='⏳ 提交…';
        return ghReq(pat,'POST','/repos/'+REPO+'/git/commits',{
          message:'Admin: update portfolio '+new Date().toISOString().slice(0,10),
          tree:tree.sha,parents:[ctx.commitSha]
        });
      })
      .then(function(nc){
        if(!nc.sha)throw new Error(nc.message||'新 commit 失敗');
        return ghReq(pat,'PATCH','/repos/'+REPO+'/git/refs/heads/'+BRANCH,{sha:nc.sha});
      })
      .then(function(updated){
        if(!(updated.object&&updated.object.sha))throw new Error(updated.message||'ref 更新失敗');
        return updated;
      })
      .catch(function(e){
        var isConflict=/fast.forward/i.test(e.message||'');
        if(isConflict&&attemptsLeft>1){
          return new Promise(function(res){setTimeout(res,900);}).then(function(){return commitWithRetry(attemptsLeft-1);});
        }
        throw e;
      });
    }
    ghReq(pat,'GET','/repos/'+REPO+'/git/ref/heads/'+BRANCH,null).then(function(_r0){
        return ghReq(pat,'GET','/repos/'+REPO+'/git/commits/'+_r0.object.sha,null);
      }).then(function(_c0){
        return ghReq(pat,'GET','/repos/'+REPO+'/git/trees/'+_c0.tree.sha+'?recursive=1',null);
      }).then(function(_tr0){
        var _e=_tr0.tree.find(function(x){return x.path===FILE;});
        if(!_e)throw new Error('找不到 '+FILE);
        return ghReq(pat,'GET','/repos/'+REPO+'/git/blobs/'+_e.sha,null);
      }).then(function(_blobData){
        var _bin=atob(_blobData.content.replace(/\n/g,''));
        var _bytes=new Uint8Array(_bin.length);
        for(var _bi=0;_bi<_bin.length;_bi++)_bytes[_bi]=_bin.charCodeAt(_bi);
        return new TextDecoder('utf-8').decode(_bytes);
      })
      .then(function(html){
        ctx.newHtml=buildDeployHtml(html);
        if(!ctx.newHtml)throw new Error('無法定位 state 區塊');
        btn.textContent='⏳ 上傳 blob…';
        return toB64uAsync(ctx.newHtml).then(function(b64){return ghReq(pat,'POST','/repos/'+REPO+'/git/blobs',{content:b64,encoding:'base64'});});
      })
      .then(function(blob){
        if(!blob.sha)throw new Error(blob.message||'blob 失敗');
        ctx.blobSha=blob.sha;
        return commitWithRetry(4);
      })
      .then(function(updated){
        state._v=0;scheduleSave();
        btn.textContent='✓ 已部署！約40秒生效';
        setTimeout(function(){btn.textContent='🚀 部署';btn.disabled=false;},5000);
      })
      .catch(function(e){alert('部署失敗: '+e.message);btn.textContent='🚀 部署';btn.disabled=false;});
  });

  // Init lists
  renderAdminArtList();renderAdminPhList();renderAdminCertList();
}

function initAdmin(){
  var adm=document.getElementById('adm');
  if(adm)adm.innerHTML=buildAdminHTML();
  bindAdmin();
  ghLoadStateJson().then(function(){
    renderAdminArtList();
    renderAdminPhList();
    renderAdminCertList();
  });
}
initAdmin();
})();
</script>
</body>
</html>
